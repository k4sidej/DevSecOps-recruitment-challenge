title = "FlowAccount custom Gitleaks rules"

# These rules are intentionally designed to catch the toy/hardcoded secrets in src/
# for this challenge repo. They are broader than real-world detectors.

[[rules]]
id = "flowaccount-aws-access-key-id"
description = "Hardcoded AWS accessKeyId (challenge format)"
regex = '''accessKeyId\s*:\s*["'](AKIA_[^"']{8,})["']'''
secretGroup = 1
keywords = ["accessKeyId"]

[[rules]]
id = "flowaccount-aws-secret-access-key"
description = "Hardcoded AWS secretAccessKey (challenge format)"
regex = '''secretAccessKey\s*:\s*["']([^"']{12,})["']'''
secretGroup = 1
keywords = ["secretAccessKey"]

[[rules]]
id = "flowaccount-stripe-secret-key"
description = "Hardcoded Stripe secretKey (challenge format)"
regex = '''secretKey\s*:\s*["'](stripe_(?:live|test)_key_[^"']{10,})["']'''
secretGroup = 1
keywords = ["secretKey", "stripe"]

[[rules]]
id = "flowaccount-stripe-webhook-secret"
description = "Hardcoded Stripe webhookSecret (challenge format)"
regex = '''webhookSecret\s*:\s*["'](stripe_whsec_[^"']{10,})["']'''
secretGroup = 1
keywords = ["webhookSecret", "stripe"]

[[rules]]
id = "flowaccount-db-password"
description = "Hardcoded DB password"
regex = '''password\s*:\s*["']([^"']{8,})["']'''
secretGroup = 1
keywords = ["password", "Pool"]
