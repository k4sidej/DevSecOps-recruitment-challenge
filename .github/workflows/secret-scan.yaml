name: Secret Scanning Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [feature/secret-scanning]

jobs:
  scan:
    name: TruffleHog & Gitleaks Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog (PR)
        id: trufflehog_pr
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          base: ""
          head: ${{ github.event.pull_request.head.ref }}
          extra_args: --results=verified,unknown,unverified --config=.trufflehog.yaml
        continue-on-error: true

      - name: Run TruffleHog (Push)
        id: trufflehog_push
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@main
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown,unverified --config=.trufflehog.yaml
        continue-on-error: true

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.24.3"
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks (PR)
        id: gitleaks_pr
        if: github.event_name == 'pull_request'
        run: |
          # Only scan the new commits added in this PR (Diff Scan)
          gitleaks detect --source . --redact --exit-code 2 --config .gitleaks.toml --log-opts="origin/${{ github.base_ref }}..HEAD"
        continue-on-error: true

      - name: Run Gitleaks (Push)
        id: gitleaks_push
        if: github.event_name == 'push'
        run: |
          # Scans the full repository history on direct push events
          gitleaks detect --source . --redact --exit-code 2 --config .gitleaks.toml
        continue-on-error: true

      - name: Post PR Comment on Failure
        # Trigger if EITHER TruffleHog OR Gitleaks fails during a PR
        if: (steps.trufflehog_pr.outcome == 'failure' || steps.gitleaks_pr.outcome == 'failure') && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const message = `
            ### ⚠️ Security Alert: Hardcoded Secrets Detected
            
            Our security scan found potential secrets in this Pull Request. **Merging is blocked** until these are resolved.
            
            #### 🔍 Findings:
            Please check the **Actions tab** logs for the specific line numbers and file paths flagged by **TruffleHog** or **Gitleaks**.
            
            #### 🛠️ How to Fix:
            1. **Invalidate the Secret:** Even if you delete the code, the secret is now compromised. You **must** rotate/revoke the API key or password immediately.
            2. **Remove from History:** - Remove the hardcoded string from your code.
               - Use environmental variables or a Secret Manager (like GitHub Secrets) instead.
            3. **Clean Git History:** If the secret was committed, use \`git filter-repo\` or BFG Repo-Cleaner to strip it from the history, or rewrite the commits before pushing again.
            
            *Note: Simply adding a new commit that deletes the secret is not enough; it will still exist in the git history.*
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      - name: Finalize Task Status
        if: |
          steps.trufflehog_pr.outcome == 'failure' ||
          steps.trufflehog_push.outcome == 'failure' ||
          steps.gitleaks_pr.outcome == 'failure' ||
          steps.gitleaks_push.outcome == 'failure'
        run: |
          echo "Secrets were found by one of the scanners."
          exit 1