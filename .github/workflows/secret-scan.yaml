name: Secret Scanning Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [feature/secret-scanning]

jobs:
  scan:
    name: TruffleHog & Gitleaks Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
          trufflehog --version

      - name: Run TruffleHog (PR)
        id: trufflehog_pr
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          trufflehog filesystem . --exclude-dist --json > trufflehog.json || true
          if [ -s trufflehog.json ]; then
            exit 1
          fi
        continue-on-error: true

      - name: Run TruffleHog (Push)
        id: trufflehog_push
        if: github.event_name == 'push'
        shell: bash
        run: |
          trufflehog filesystem . --exclude-dist --json > trufflehog.json || true
          if [ -s trufflehog.json ]; then
            exit 1
          fi
        continue-on-error: true

      # - name: Install Gitleaks
      #   shell: bash
      #   run: |
      #     set -euo pipefail
      #     GITLEAKS_VERSION="8.24.3"
      #     curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
      #     tar -xzf gitleaks.tar.gz gitleaks
      #     sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      #     gitleaks version

      # - name: Run Gitleaks (PR)
      #   id: gitleaks_pr
      #   if: github.event_name == 'pull_request'
      #   shell: bash
      #   run: |
      #     gitleaks detect --source . --no-git --redact --exit-code 2 --config .gitleaks.toml --report-path gitleaks-report.json
      #   continue-on-error: true

      # - name: Run Gitleaks (Push)
      #   id: gitleaks_push
      #   if: github.event_name == 'push'
      #   shell: bash
      #   run: |
      #     gitleaks detect --source . --no-git --redact --exit-code 2 --config .gitleaks.toml
      #   continue-on-error: true

      - name: Post PR Comment on Failure
        # Trigger if EITHER TruffleHog OR Gitleaks fails during a PR
        if: steps.trufflehog_pr.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let table = '| File | Line | Secret Type | Remediation |\n|------|------|-------------|-------------|\n';
            let hasFindings = false;

            // Function to parse TruffleHog JSON output (NDJSON)
            const parseTruffleHog = () => {
              try {
                if (fs.existsSync('trufflehog.json')) {
                  const content = fs.readFileSync('trufflehog.json', 'utf8');
                  const lines = content.trim().split('\n');
                  lines.forEach(line => {
                    if (!line) return;
                    const result = JSON.parse(line);
                    hasFindings = true;
                    
                    // Extract fields safely
                    // Filesystem scan structure: SourceMetadata.Data.Filesystem.file
                    const file = result.SourceMetadata?.Data?.Filesystem?.file || 'Unknown File';
                    const lineNum = result.SourceMetadata?.Data?.Filesystem?.line || '0';
                    const type = result.DetectorName || 'Unknown Secret';
                    const remediation = 'Move to Github Secrets and inject via env vars.';
                    
                    table += `| \`${file}\` | ${lineNum} | ${type} | ${remediation} |\n`;
                  });
                }
              } catch (err) {
                console.error('Error parsing trufflehog report:', err);
              }
            };

            parseTruffleHog();

            // Append Gitleaks findings if any (optional, keeping for completeness if file exists)
            // try {
            //   if (fs.existsSync('gitleaks-report.json')) {
            //      const glContent = fs.readFileSync('gitleaks-report.json', 'utf8');
            //      if (glContent) {
            //        const glResults = JSON.parse(glContent);
            //        glResults.forEach(f => {
            //          // Deduplication logic could go here, but simply appending for now
            //          table += `| \`${f.File}\` | ${f.StartLine} | ${f.RuleID} (Gitleaks) | Move to Github Secrets |\n`;
            //          hasFindings = true;
            //        });
            //      }
            //   }
            // } catch (ignore) {}

            if (!hasFindings) {
               table += '| Unparsed Findings | - | Check Actions Logs | See TruffleHog/Gitleaks logs |\n';
            }

            const message = `
            ### ⚠️ Security Alert: Hardcoded Secrets Detected
            
            Our security scan found potential secrets in this Pull Request. **Merging is blocked** until these are resolved.
            
            #### 🔍 Findings:
            ${table}
            
            #### 🛠️ How to Fix:
            1. **Invalidate the Secret:** Even if you delete the code, the secret is now compromised. You **must** rotate/revoke the API key or password immediately.
            2. **Remove from History:** - Remove the hardcoded string from your code.
               - Use environmental variables or a Secret Manager (like GitHub Secrets) instead.
            3. **Clean Git History:** If the secret was committed, use \`git filter-repo\` or BFG Repo-Cleaner to strip it from the history, or rewrite the commits before pushing again.
            
            *Note: Simply adding a new commit that deletes the secret is not enough; it will still exist in the git history.*
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      - name: Finalize Task Status
        if: |
          steps.trufflehog_pr.outcome == 'failure' ||
          steps.trufflehog_push.outcome == 'failure'
        run: |
          echo "Secrets were found by one of the scanners."
          exit 1