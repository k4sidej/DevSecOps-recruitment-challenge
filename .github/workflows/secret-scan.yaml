name: Secret Scanning Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [feature/secret-scanning]

jobs:
  scan:
    name: TruffleHog Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog (PR)
        id: trufflehog_pr
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          base: ""
          head: ${{ github.event.pull_request.head.ref }}
          extra_args: --results=verified,unknown,unverified --config=.trufflehog.yaml
        continue-on-error: true

      - name: Run TruffleHog (Push)
        id: trufflehog_push
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@main
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown,unverified --config=.trufflehog.yaml
        continue-on-error: true

      - name: Run Gitleaks (PR)
        id: gitleaks_pr
        if: github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
        continue-on-error: true

      - name: Run Gitleaks (Push)
        id: gitleaks_push
        if: github.event_name == 'push'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
        continue-on-error: true

      - name: Post PR Comment on Failure
        if: steps.trufflehog_pr.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          ### Generate a detailed comment
          script: |
            const message = `
            ### ⚠️ Security Alert: Hardcoded Secrets Detected
            
            Our security scan found potential secrets in this Pull Request. **Merging is blocked** until these are resolved.
            
            #### 🔍 Findings:
            Please check the **Actions tab** logs for the specific line numbers and file paths flagged by TruffleHog.
            
            #### 🛠️ How to Fix:
            1. **Invalidate the Secret:** Even if you delete the code, the secret is now compromised. You **must** rotate/revoke the API key or password immediately.
            2. **Remove from History:** - Remove the hardcoded string from your code.
               - Use environmental variables or a Secret Manager (like GitHub Secrets) instead.
            3. **Clean Git History:** If the secret was committed, use \`git filter-repo\` or BFG Repo-Cleaner to strip it from the history, or rewrite the commits before pushing again.
            
            *Note: Simply adding a new commit that deletes the secret is not enough; it will still exist in the git history.*
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      - name: Finalize Task Status
        if: |
          steps.trufflehog_pr.outcome == 'failure' ||
          steps.trufflehog_push.outcome == 'failure' ||
          steps.gitleaks_pr.outcome == 'failure' ||
          steps.gitleaks_push.outcome == 'failure'
        run: |
          echo "Secrets were found."
          exit 1